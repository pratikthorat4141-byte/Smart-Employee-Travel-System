name: mobile_app
description: Smart Employee Travel Solution

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5+1

  # Networking
  http: ^1.5.0

  # Fonts
  google_fonts: ^6.3.1

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  # Routing
  go_router: ^16.2.1

  # UI
  flutter_svg: ^2.2.0
  lottie: ^3.3.2

  # Date & Time
  intl: ^0.20.2

  # SQLite
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  # PDF Report
  pdf: ^3.11.3
  printing: ^5.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true