name: mobile_app
description: Smart Employee Travel Solution

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  #==========================
  # State Management
  #==========================
  provider: ^6.1.5+1

  #==========================
  # Networking
  #==========================
  http: ^1.5.0

  #==========================
  # Google Maps & Live Tracking
  #==========================
  google_maps_flutter: ^2.12.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  flutter_polyline_points: ^2.1.0

  #==========================
  # UUID
  #==========================
  uuid: ^4.5.1

  #==========================
  # Fonts
  #==========================
  google_fonts: ^6.3.1

  #==========================
  # Local Storage
  #==========================
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  #==========================
  # Routing
  #==========================
  go_router: ^16.2.1

  #==========================
  # UI
  #==========================
  flutter_svg: ^2.2.0
  lottie: ^3.3.0

  #==========================
  # Date & Time
  #==========================
  intl: ^0.20.2

  #==========================
  # SQLite
  #==========================
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5

  #==========================
  # PDF Report
  #==========================
  pdf: ^3.11.3
  printing: ^5.14.2

  #==========================
  # Excel Report
  #==========================
  excel: ^4.0.6

  #==========================
  # Share Files
  #==========================
  share_plus: ^11.1.0

  #==========================
  # Email OTP
  #==========================
  mailer: ^6.5.0

  #==========================
  # Razorpay Payment
  #==========================
  razorpay_flutter: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/admin_logo.png
    - assets/icons/
    - assets/lottie/